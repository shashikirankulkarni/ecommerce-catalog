# dev: the app runs inside srv-dev, on the catalog-net-nonprod network.
# Host is the CONTAINER NAME on port 5432, not localhost:5433 - inside
# the network there is no port mapping to go through.
spring.datasource.url=jdbc:postgresql://catalog-postgres-nonprod:5432/catalog_dev
spring.datasource.username=catalog_dev_user

# ---------------------------------------------------------------------
# Access log - one line per request: host, time, request line, status,
# bytes, and duration in milliseconds. This is the log you want when
# someone reports "it was slow at 3pm".
#
# directory=/dev and prefix/suffix empty sends it to stdout, so it is
# collected by the container platform rather than written to a file
# nobody will find.
# ---------------------------------------------------------------------
server.tomcat.accesslog.enabled=true
server.tomcat.accesslog.directory=/dev
server.tomcat.accesslog.prefix=stdout
server.tomcat.accesslog.suffix=
# rotate defaults to true, which appends a date to the filename - Tomcat
# would try to open /dev/stdout.2026-09-06, a new file in a root-owned
# directory, and fail with Permission denied. With rotate off the target
# is exactly /dev/stdout, the symlink to this process's own fd 1.
server.tomcat.accesslog.rotate=false
server.tomcat.accesslog.buffered=false
server.tomcat.accesslog.pattern=%h %t "%r" %s %b %Dms
