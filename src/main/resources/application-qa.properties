# qa: same Postgres instance as dev, different database and role.
spring.datasource.url=jdbc:postgresql://catalog-postgres-nonprod:5432/catalog_qa
spring.datasource.username=catalog_qa_user

# ---------------------------------------------------------------------
# Access log - one line per request: host, time, request line, status,
# bytes, and duration in milliseconds. This is the log you want when
# someone reports "it was slow at 3pm".
#
# directory=/dev and prefix/suffix empty sends it to stdout, so it is
# collected by the container platform rather than written to a file
# nobody will find.
# ---------------------------------------------------------------------
server.tomcat.accesslog.enabled=true
server.tomcat.accesslog.directory=/dev
server.tomcat.accesslog.prefix=stdout
server.tomcat.accesslog.suffix=
server.tomcat.accesslog.buffered=false
server.tomcat.accesslog.pattern=%h %t "%r" %s %b %Dms
