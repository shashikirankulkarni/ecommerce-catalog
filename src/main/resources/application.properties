# =====================================================================
#  catalog service - shared configuration
# =====================================================================
#  No credential appears in this file. Every secret is read from an
#  environment variable, and none has a default: if a variable is
#  missing the application refuses to start, loudly, at boot.
#
#  A default such as ${DB_PASSWORD:changeme} would let it start on the
#  wrong credential and fail later, somewhere far from the cause.
# =====================================================================

spring.application.name=catalog
server.port=${SERVER_PORT:8080}

# Local convenience only. Reads ./.env (gitignored) as a property
# source so developers do not have to set variables by hand in the IDE.
# 'optional:' means the app still starts on servers, where the file is
# absent and the variables come from the process environment instead.
spring.config.import=optional:file:./.env[.properties]

# Applies when SPRING_PROFILES_ACTIVE is not set.
spring.profiles.default=local

# ---------------------------------------------------------------------
# Datasource - url and username come from the active profile.
# The password never does.
# ---------------------------------------------------------------------
spring.datasource.password=${DB_PASSWORD}

# ---------------------------------------------------------------------
# JPA / Hibernate - Flyway owns the schema, Hibernate only validates it
# ---------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ---------------------------------------------------------------------
# Flyway
# ---------------------------------------------------------------------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false

# ---------------------------------------------------------------------
# Application secrets - all externalised, no defaults
# ---------------------------------------------------------------------
app.jwt.secret=${JWT_SECRET}
app.jwt.expiry-minutes=${JWT_EXPIRY_MINUTES:60}

app.payment.stripe-key=${STRIPE_KEY}
app.payment.webhook-secret=${STRIPE_WEBHOOK_SECRET}
app.payment.merchant-id=${STRIPE_MERCHANT_ID}
app.payment.base-url=${STRIPE_BASE_URL:https://api.stripe.com/v1}

app.aws.access-key=${AWS_ACCESS_KEY}
app.aws.secret-key=${AWS_SECRET_KEY}
app.aws.region=${AWS_REGION:ap-south-1}

# ---------------------------------------------------------------------
# Actuator
#
# Only health and info are published. '*' additionally exposes /env,
# /configprops, /beans, /mappings and /threaddump - unauthenticated.
# With show-values=ALWAYS, /actuator/env returns credentials in
# plaintext to anyone who can reach the port; /beans and /mappings map
# the whole application surface for an attacker before they touch a
# single endpoint.
#
# show-details=when-authorized rather than 'always': the health probe
# stays available for the deploy gate, but component detail (database
# host, disk paths) is not handed to anonymous callers.
# ---------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true

# ---------------------------------------------------------------------
# springdoc
# ---------------------------------------------------------------------
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ---------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------
logging.level.org.flywaydb=INFO
