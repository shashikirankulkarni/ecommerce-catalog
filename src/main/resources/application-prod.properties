# prod: a separate Postgres on a separate network. srv-dev and srv-qa
# cannot resolve this hostname at all - isolation at the network layer,
# not the credential layer.
spring.datasource.url=jdbc:postgresql://catalog-postgres-prod:5432/catalog_prod
spring.datasource.username=catalog_prod_user

logging.level.org.hibernate.SQL=WARN

# Swagger publishes the entire API surface to anyone who can reach the
# port. Same class of problem as an over-exposed Actuator.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# ---------------------------------------------------------------------
# Access log - one line per request: host, time, request line, status,
# bytes, and duration in milliseconds. This is the log you want when
# someone reports "it was slow at 3pm".
#
# directory=/dev and prefix/suffix empty sends it to stdout, so it is
# collected by the container platform rather than written to a file
# nobody will find.
# ---------------------------------------------------------------------
server.tomcat.accesslog.enabled=true
server.tomcat.accesslog.directory=/dev
server.tomcat.accesslog.prefix=stdout
server.tomcat.accesslog.suffix=
server.tomcat.accesslog.buffered=false
server.tomcat.accesslog.pattern=%h %t "%r" %s %b %Dms
