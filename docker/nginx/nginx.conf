# Reverse proxy for the local container estate.
#
# Routes on the Host header, the way a load balancer or ingress does in
# a real deployment. The application servers listen on 8080 internally
# and nobody outside the network needs to know that.
#
# Only dev is defined for now. nginx resolves proxy_pass hostnames at
# startup and refuses to start if one does not exist, so blocks for qa
# and prod are added when those containers are built.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Log the real client, not the proxy. Without X-Forwarded-For the
    # application's access log records nginx's container IP for every
    # single request, which makes it useless for answering "who did this".
    log_format  proxy  '$remote_addr -> $host$request_uri  $status  '
                       '${request_time}s  upstream=$upstream_addr';
    access_log  /dev/stdout proxy;
    error_log   /dev/stderr warn;

    sendfile        on;
    keepalive_timeout  65;

    # Anything that does not match a known hostname is refused rather
    # than falling through to whichever server block happens to be first.
    # Without this, a request with no Host header would silently reach dev.
    server {
        listen      80  default_server;
        listen      443 ssl default_server;
        server_name _;
        ssl_certificate     /etc/nginx/certs/catalog.crt;
        ssl_certificate_key /etc/nginx/certs/catalog.key;
        return      444;   # close the connection without a response
    }

    # Plain HTTP exists only to send people to HTTPS.
    server {
        listen      80;
        server_name catalog.com dev.catalog.com qa.catalog.com;
        return      301 https://$host$request_uri;
    }

    server {
        listen      443 ssl;
        http2       on;
        server_name dev.catalog.com;

        ssl_certificate     /etc/nginx/certs/catalog.crt;
        ssl_certificate_key /etc/nginx/certs/catalog.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        # The single-page application. Served by nginx directly rather
        # than proxied - nginx is far better at static files than Tomcat,
        # and it lets the frontend and backend deploy independently.
        #
        # The files arrive in a named volume that the frontend's deploy
        # job writes to. Until the first frontend deployment this returns
        # 404, which is correct: nothing has been deployed.
        root /srv/frontend/dev;
        index index.html;

        location / {
            # Fall back to index.html so a refresh on any path still
            # loads the application rather than 404ing on a route the
            # server knows nothing about.
            try_files $uri $uri/ /index.html;
        }

        # Hashed asset filenames change whenever their content changes,
        # so they can be cached indefinitely. index.html must not be, or
        # browsers keep loading the old bundle after a deployment.
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        location = /index.html {
            add_header Cache-Control "no-cache";
        }

        location /api/ {
            proxy_pass http://srv-dev:8080;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            # The application speaks plain HTTP on 8080. TLS ends here,
            # at the edge. X-Forwarded-Proto is how the application knows
            # the original request was https - without it, any redirect it
            # generates would send the client back to http.
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host  $host;

            proxy_connect_timeout 5s;
            proxy_read_timeout    60s;
        }

        # Swagger and the OpenAPI document, still reachable in dev.
        location /swagger-ui {
            proxy_pass http://srv-dev:8080;
            proxy_set_header Host $host;
        }

        location /v3/api-docs {
            proxy_pass http://srv-dev:8080;
            proxy_set_header Host $host;
        }

        # The health endpoint, kept out of the access log so a polling
        # health check does not drown everything else.
        location /actuator/health {
            proxy_pass http://srv-dev:8080/actuator/health;
            proxy_set_header Host $host;
            access_log off;
        }
    }
}
