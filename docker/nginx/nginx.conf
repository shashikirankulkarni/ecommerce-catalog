# Reverse proxy for the local container estate.
#
# Routes on the Host header, the way a load balancer or ingress does in
# a real deployment. The application servers listen on 8080 internally
# and nobody outside the network needs to know that.
#
# Only dev is defined for now. nginx resolves proxy_pass hostnames at
# startup and refuses to start if one does not exist, so blocks for qa
# and prod are added when those containers are built.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Log the real client, not the proxy. Without X-Forwarded-For the
    # application's access log records nginx's container IP for every
    # single request, which makes it useless for answering "who did this".
    log_format  proxy  '$remote_addr -> $host$request_uri  $status  '
                       '${request_time}s  upstream=$upstream_addr';
    access_log  /dev/stdout proxy;
    error_log   /dev/stderr warn;

    sendfile        on;
    keepalive_timeout  65;

    # Anything that does not match a known hostname is refused rather
    # than falling through to whichever server block happens to be first.
    # Without this, a request with no Host header would silently reach dev.
    server {
        listen      80 default_server;
        server_name _;
        return      444;   # close the connection without a response
    }

    server {
        listen      80;
        server_name dev.catalog.com;

        location / {
            proxy_pass http://srv-dev:8080;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host  $host;

            proxy_connect_timeout 5s;
            proxy_read_timeout    60s;
        }

        # The health endpoint, kept out of the access log so a polling
        # health check does not drown everything else.
        location /actuator/health {
            proxy_pass http://srv-dev:8080/actuator/health;
            proxy_set_header Host $host;
            access_log off;
        }
    }
}
