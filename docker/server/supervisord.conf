; supervisord stands in for systemd, which does not run cleanly inside a
; container - it expects to be PID 1 and to control cgroups. The concepts
; map one to one: start, stop, restart, restart-on-crash, capture logs.
;
; On a real VM this file would be two systemd unit files instead.

[program:sshd]
command=/usr/sbin/sshd -D -e
autostart=true
autorestart=true
startsecs=2
stdout_logfile=/var/log/supervisor/sshd.out.log
stderr_logfile=/var/log/supervisor/sshd.err.log

[program:catalog]
; The JAR does not exist until the first deployment, so this starts
; stopped. `supervisorctl start catalog` is what the deploy runs.
command=/bin/bash -c 'set -a; [ -f /opt/catalog/.env ] && . /opt/catalog/.env; set +a; exec java -jar /opt/catalog/catalog.jar'
directory=/opt/catalog
user=deploy
autostart=false
autorestart=unexpected
startsecs=10
stopwaitsecs=30
; SIGTERM to the whole process group, so the JVM shuts down gracefully
; and Spring's shutdown hooks run.
stopsignal=TERM
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/supervisor/catalog.out.log
stderr_logfile=/var/log/supervisor/catalog.err.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
