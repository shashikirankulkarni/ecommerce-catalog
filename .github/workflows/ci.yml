# Pull request gate.
#
# Runs on GitHub-hosted runners, ALWAYS. This workflow is triggered by
# pull_request, which fires for pull requests from forks - so it can be
# asked to execute a stranger's code. That must never happen on the
# self-hosted runner, which is a container on a laptop.
#
# The rule for this repository: pull_request -> ubuntu-latest.
#                               push to a protected branch -> self-hosted.

name: CI

on:
  pull_request:
    branches: [main, dev, qa, prod]

permissions:
  contents: read
  security-events: write   # required to publish SARIF to the Security tab

concurrency:
  # Supersede an in-flight run when the PR is pushed to again.
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: "8.30.1"
  GRYPE_VERSION: "0.118.0"

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and test
        # The application refuses to start without these - PaymentProperties
        # is @Validated @NotBlank. Locally they come from a gitignored .env,
        # which by design does not exist here. These are throwaway values
        # for the test context only; the datasource is replaced by
        # Testcontainers via @ServiceConnection.
        env:
          DB_PASSWORD: ci_placeholder_unused
          JWT_SECRET: ci_placeholder_jwt
          STRIPE_KEY: sk_test_ci_placeholder
          STRIPE_WEBHOOK_SECRET: whsec_ci_placeholder
          STRIPE_MERCHANT_ID: acct_ci_placeholder
          AWS_ACCESS_KEY: AKIACIPLACEHOLDER000
          AWS_SECRET_KEY: ci_placeholder_aws_secret
        run: ./mvnw -B verify

      - name: Hand the JAR to the scan job
        uses: actions/upload-artifact@v4
        with:
          name: catalog-jar
          path: target/*.jar
          retention-days: 1

  scan:
    name: Security scan
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # gitleaks detect walks history, not the worktree

      - uses: actions/download-artifact@v4
        with:
          name: catalog-jar
          path: target

      - name: Install scanners
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar xzf gitleaks.tar.gz gitleaks && sudo mv gitleaks /usr/local/bin/
          curl -sSfL https://get.anchore.io/grype \
            | sudo sh -s -- -b /usr/local/bin "v${GRYPE_VERSION}"

      - name: Scan for secrets in git history
        run: gitleaks detect --source . --report-format sarif --report-path gitleaks.sarif --redact

      - name: Scan the artifact for known vulnerabilities
        run: grype "target/catalog-0.0.1-SNAPSHOT.jar" --fail-on high -o sarif > grype.sarif

      - name: Publish findings to the Security tab
        # always(), so findings are visible even when the scan step failed -
        # a red X with no detail is not actionable.
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: grype.sarif
          category: grype
