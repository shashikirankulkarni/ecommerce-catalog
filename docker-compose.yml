# Local container estate for the catalog service.
#
# Nothing starts unless a profile is named:
#   docker compose --profile db  up -d     # just Postgres
#   docker compose --profile dev up -d     # + runner + srv-dev
#   docker compose --profile all up -d     # everything
#
# Credentials come from docker/postgres/.env, which is gitignored.
# Copy docker/postgres/.env.example to .env and fill it in before the
# first `up`. The initdb script fails loudly if a value is missing.

services:
  postgres-nonprod:
    image: postgres:17
    container_name: catalog-postgres-nonprod
    profiles: [db, dev, all]
    restart: unless-stopped
    # env_file puts these variables inside the container, where both the
    # Postgres entrypoint and the initdb script can read them. Nothing is
    # interpolated into this YAML, so no value appears in the repository.
    env_file:
      - ./docker/postgres/.env
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
    ports:
      - "5433:5432"
    volumes:
      - pgdata-nonprod:/var/lib/postgresql/data
      - ./docker/postgres/initdb:/docker-entrypoint-initdb.d:ro
    networks:
      - catalog-net-nonprod
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  # GitHub Actions self-hosted runner.
  #
  # Deliberately no restart policy: this should not sit idle in the
  # background consuming memory. Start it when you want the pipeline.
  #
  # RUNNER_TOKEN is a short-lived registration token, minted on demand:
  #   export RUNNER_TOKEN=$(gh api -X POST \
  #     repos/shashikirankulkarni/ecommerce-catalog/actions/runners/registration-token \
  #     --jq .token)
  runner:
    build:
      context: ./docker/runner
    image: catalog-runner:local
    container_name: catalog-runner
    profiles: [runner, dev, all]
    environment:
      GH_REPO_URL: https://github.com/shashikirankulkarni/ecommerce-catalog
      RUNNER_TOKEN: ${RUNNER_TOKEN:?set RUNNER_TOKEN - see comment above}
      RUNNER_NAME: catalog-runner
      RUNNER_LABELS: self-hosted,linux,arm64,catalog
    networks:
      - catalog-net-nonprod

  # Application server for the dev environment.
  #
  # A long-lived box, built once. Deployments copy a JAR into /opt/catalog
  # over SSH and restart it through supervisorctl - the container itself is
  # never rebuilt to ship a new version.
  srv-dev:
    build:
      context: ./docker/server
    image: catalog-server:local
    container_name: srv-dev
    profiles: [dev, all]
    restart: unless-stopped
    ports:
      - "8081:8080"   # the app, once deployed
      - "2222:22"     # ssh, for you from the Mac
    networks:
      - catalog-net-nonprod

  # Reverse proxy. Routes on the Host header, the way an ingress or load
  # balancer does in a real deployment, so environments are reached by
  # name rather than by remembering which port each one published.
  #
  # Requires an /etc/hosts entry on the Mac:
  #   127.0.0.1  dev.catalog.com qa.catalog.com catalog.com
  nginx:
    image: nginx:1.27-alpine
    container_name: catalog-nginx
    profiles: [dev, all]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # Certificates are generated per machine and gitignored. See
      # docker/nginx/certs/README.md to recreate them.
      - ./docker/nginx/certs:/etc/nginx/certs:ro
    networks:
      - catalog-net-nonprod
    depends_on:
      - srv-dev
    # json-file has no size limit by default; a busy service can fill the
    # VM's disk and take down every container on it.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pgdata-nonprod:

networks:
  catalog-net-nonprod:
    name: catalog-net-nonprod
